[program:samanvay-redis]
command=/root/.venv/bin/python /app/backend/run_redis.py
directory=/app/backend
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/samanvay-redis.out.log
stderr_logfile=/var/log/supervisor/samanvay-redis.err.log

[program:samanvay-events]
command=/root/.venv/bin/python /app/backend/event_worker.py
directory=/app/backend
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/samanvay-events.out.log
stderr_logfile=/var/log/supervisor/samanvay-events.err.log